<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Investigación - UT</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilos/admin.css">
</head>
<body>

  <!-- 1. PANTALLA DE BLOQUEO CON CONTRASEÑA -->
  <div id="seccionLogin" class="caja-login">
    <h3>🔒 Panel de Investigación</h3>
    <p>Maestría en Pedagogía y Mediaciones Tecnológicas - IDEAD</p>
    <p style="font-size: 12px; color: #64748b;">Ingrese la clave de administrador para consultar los datos:</p>
    
    <input type="password" id="inputClave" placeholder="Ingresa la contraseña..." required>
    <button class="btn-login" onclick="iniciarSesion()">Ingresar al Panel</button>
    <p id="errorLogin" class="alerta-error"></p>
  </div>

  <!-- 2. TABLA CON TODAS LAS RESPUESTAS -->
  <div id="panelDatos">
    <div class="encabezado-panel">
      <div>
        <h2>📋 Respuestas de la Investigación</h2>
        <p style="font-size: 13px; color: #64748b;">Investigador: Luisa Fernanda Briñez Forero</p>
      </div>
      <button class="btn-descargar" onclick="descargarExcel()">📥 Descargar en Excel (.CSV)</button>
    </div>

    <div class="tabla-contenedor">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Acudiente</th>
            <th>Estudiante</th>
            <th>Grado</th>
            <th>Respuestas de Poesía / TIC</th>
            <th>Fecha</th>
          </tr>
        </thead>
        <tbody id="cuerpoTabla"></tbody>
      </table>
    </div>
  </div>

  <!-- Conexión con el archivo de lógica -->
  <script src="logica/admin.js"></script>
</body>
</html>
