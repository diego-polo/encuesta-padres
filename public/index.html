<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="estilos/index.css">
  <title>Formulario para Padres de Familia</title>
</head>
<body>
  <div class="contenedor">
    <div class="cabecera-logos">
      <img src="https://upload.wikimedia.org/wikipedia/commons/d/d0/Logo_universidad_del_tolima_version_web.png" alt="logo universidad del tolima" class="logo-Universidad">
      <img src="https://upload.wikimedia.org/wikipedia/commons/d/d0/Logo_universidad_del_tolima_version_web.png" alt="logo universidad del tolima" class="logo-Universidad">
    </div>
    
    <p style="font-weight: bold; text-align: center;">Universidad del Tolima</p>
    <p style="text-align: center; font-size: 13px;">Maestría en Pedagogía y mediaciones tecnológicas-IDEAD</p>
    <p style="text-align: center; font-size: 13px; margin-bottom: 20px;"><strong>Investigador:</strong> Luisa Fernanda Briñez Forero</p>

    <h2>Formulario para Padres de Familia</h2>
    
    <form id="MiFormulario">
      <div class="grupo">
        <label>Nombre del Acudiente / Padre / Madre:</label>
        <input type="text" name="nombre_acudiente" required placeholder="Ej: María Pérez">
      </div>

      <div class="grupo">
        <label>Nombre del Estudiante:</label>
        <input type="text" name="nombre_estudiante" required placeholder="Ej: Pepito Pérez">
      </div>

      <div class="grupo">
        <label>Grado del estudiante:</label>
        <select name="grado" required>
          <option value="">--- Seleccione el grado ---</option>
          <option value="Preescolar">Preescolar</option>
          <option value="Primero">1°</option>
          <option value="Segundo">2°</option>
          <option value="Tercero">3°</option>
          <option value="Cuarto">4°</option>
          <option value="Quinto">5°</option>
        </select>
      </div>

      <div class="grupo">
        <label>1. ¿Con qué frecuencia su hijo realiza actividades de lectura en casa? ¿Qué tipo de texto prefiere leer su hijo?</label>
        <textarea name="pregunta1" rows="3" required placeholder="Escriba su respuesta..."></textarea>
      </div>

      <div class="grupo">
        <label>2. ¿Su hijo utiliza dispositivos tecnológicos para leer? ¿Considera que los medios tecnológicos pueden ayudar a mejorar la comprensión lectora?</label>
        <textarea name="pregunta2" rows="3" required placeholder="Escriba su respuesta..."></textarea>
      </div>

      <div class="grupo">
        <label>3. ¿Cree que la poesía puede ayudar a mejorar la comprensión lectora? ¿Cómo?</label>
        <textarea name="pregunta3" rows="3" required placeholder="Escriba su respuesta..."></textarea>
      </div>

      <div class="grupo">
        <label>4. ¿Le gustaría que su hijo(a) aprendiera poesía a través de videos, audios o aplicaciones digitales?</label>
        <textarea name="pregunta4" rows="3" required placeholder="Escriba su respuesta..."></textarea>
      </div>

      <div class="grupo">
        <label>5. ¿Cuál es el libro de poesía que ha leído recientemente mediada por TIC en casa con su hijo?</label>
        <textarea name="pregunta5" rows="3" required placeholder="Escriba su respuesta..."></textarea>
      </div>

      <div class="grupo">
        <label>6. ¿Estaría dispuesto (a) a apoyar las actividades digitales de la poesía para mejorar la comprensión lectora?</label>
        <textarea name="pregunta6" rows="3" required placeholder="Escriba su respuesta..."></textarea>
      </div>

      <button type="submit" class="submit">Enviar Respuestas</button>
    </form>

    <div id="mensajeAlerta" style="display: none;" class="alerta"></div>
  </div>

  <script src="logica/index.js" defer></script>
</body>
</html>
